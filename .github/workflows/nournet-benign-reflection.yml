name: Nournet benign reflection evidence
on:
  push:
    branches:
      - audit/nournet-safe-reflection-20261102
    paths:
      - ".github/workflows/nournet-benign-reflection.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline regression tests
        run: python3 -m unittest discover -s nournet_audit -p test_benign_canary.py -v
      - name: Scope-limited harmless reflection check
        run: python3 nournet_audit/benign_canary.py
      - name: Upload sanitized JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nournet-benign-reflection-summary
          path: nournet-canary-report.json
          retention-days: 2
          if-no-files-found: warn
