name: ZAP Active Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Run ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: "https://www.nournet.com.sa"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-active-report
