name: Nournet low-impact baseline comparison
on:
  push:
    branches:
      - audit/nournet-error-baseline-20261102
    paths:
      - ".github/workflows/nournet-baseline-status.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s nournet_audit -p "test_baseline_status.py" -v
      - name: Six bounded GET requests
        run: python3 nournet_audit/baseline_status.py
      - name: Upload minimal result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nournet-baseline-status
          path: nournet-baseline-status-report.json
          retention-days: 2
          if-no-files-found: warn
