name: ZAP local-only baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable localhost fixture
        run: |
          mkdir -p /tmp/zap-fixture
          printf '<!doctype html><title>Disposable ZAP Fixture</title><h1>Local-only security check</h1>' > /tmp/zap-fixture/index.html
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/zap-fixture > /tmp/zap-fixture/server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: OWASP ZAP baseline against loopback only
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://127.0.0.1:8765/'
          rules_file_name: ''
          cmd_options: '-m 1'
          fail_action: false
          allow_issue_writing: false
      - name: Save available ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-local-baseline-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
