name: Nournet ZAP Baseline (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ZAP passive baseline on declared host
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://nour.net.sa/'
          cmd_options: '-m 1 -T 5'
          allow_issue_writing: false
          fail_action: false
          artifact_name: 'nournet-zap-baseline'
